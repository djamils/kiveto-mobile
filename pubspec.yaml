name: kiveto_mobile
description: "Kiveto Portal app for pet owners, Android and iOS."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
#
# Kept in alphabetical order (sort_pub_dependencies). Dev dependencies are
# pinned exactly: their versions were checked on pub.dev on 2026-11-03
# (architecture §5). riverpod_lint is an analyzer plugin, declared in
# analysis_options.yaml, not here.
dependencies:
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # The generated Portal API client (packages/kiveto_portal_api, written by
  # `make api-generate`) and its runtime: dio and tonik_util (TonikResult,
  # OffsetDateTime, Date, ServerConfig), versions checked on pub.dev on
  # 2026-11-03 and pinned exactly. Rule 7 confines kiveto_portal_api and
  # tonik_util to features/*/infrastructure/, core/network/ and core/di/;
  # Dio is refused in domain/, application/ and presentation/ (rules 1–3)
  # and, by convention, used only under those same three data-side folders.
  dio: 5.11.1
  flutter:
    sdk: flutter
  # The app foundation (phase 5), versions checked on pub.dev on 2026-11-03
  # (all latest, resolution checked with `fvm flutter pub add --dry-run`)
  # and pinned exactly. flutter_localizations brings the Flutter, Material
  # and Cupertino strings in French; gen-l10n writes lib/l10n/ from the ARB.
  flutter_localizations:
    sdk: flutter
  # State and dependency injection, without code generation (D7).
  flutter_riverpod: 3.4.3
  # Tokens, refresh token and device id: Keychain / Android Keystore.
  flutter_secure_storage: 11.2.0
  # The router: the 5-tab shell, the redirects, the /invitation deep link.
  go_router: 18.1.2
  # French dates and amounts; the same 0.20.3 as the ^0.20.3 of the SDK's
  # flutter_localizations.
  intl: 0.20.3
  kiveto_portal_api:
    path: packages/kiveto_portal_api
  # go_router 18 is built on material_ui (the Material library moved out of
  # the SDK): the app imports package:material_ui/material_ui.dart, never
  # package:flutter/material.dart, so that there is one MaterialApp, one
  # Theme and one MaterialLocalizations.
  material_ui: 1.9.0
  # Slice 2 (document): the in-app PDF viewer of the documents (and, later,
  # of the vaccination booklet), checked on pub.dev on 2026-11-03 and pinned
  # exactly: latest, publisher espresso3389.jp, 160/160 points, ~610 k
  # downloads in 30 days, `sdk: ^3.13.0`, `flutter: >=3.47.0`; it depends on
  # material_ui ^1.0.0 and imports only material_ui (never
  # flutter/material.dart). Its native-assets hook (pdfium_dart) builds a
  # small C gate and downloads PDFium chromium/8125 (unverified archive,
  # deferred-work) on every first build, `flutter test` included: a C
  # toolchain and network are needed then (CONTRIBUTING §5). It brings
  # into the lock pdfrx_engine 0.9.0, pdfium_dart 0.4.1, pdfium_flutter
  # 0.4.1, native_toolchain_c 0.19.5, archive 4.6.0, glob 2.2.0, http 1.6.0,
  # image 4.12.0, posix 6.5.4, process 5.0.6, rxdart 0.28.0 and synchronized
  # 3.5.0. Rejected: pdfx, which re-exports photo_view 0.15.0 (unmaintained
  # since 2024-04), which imports flutter/material.dart.
  pdfrx: 2.11.0
  # Slice 4 (scheduling): « Ajouter à mon calendrier » hands the `.ics` of
  # an appointment to the OS share sheet (ACTION_SEND on Android: Drive,
  # Gmail, Messages, Bluetooth; iOS's sheet offers « Ajouter au
  # calendrier ») — the Android emulator has no `text/calendar` VIEW
  # handler (Google Calendar does not import `.ics`). Checked on pub.dev on
  # 2026-11-03 and pinned exactly: latest, published 2026-10-01 by
  # fluttercommunity.dev, Flutter Favorite, Dart >= 3.10 / Flutter >=
  # 3.38.1; `fvm flutter pub add --dry-run share_plus:13.3.1` resolves,
  # adding share_plus_platform_interface 7.2.0 and cross_file 0.3.5+5.
  share_plus: 13.3.1
  # Slice 1 (identity_access, client), versions checked on pub.dev on
  # 2026-11-03 (both latest, flutter.dev, Dart >= 3.11, resolution checked
  # with `fvm flutter pub add --dry-run`) and pinned exactly:
  # shared_preferences keeps the active clinic per account, url_launcher
  # opens the terms of use.
  shared_preferences: 2.5.6
  tonik_util: 0.11.1
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The repository's Dart tooling (tool/lib/): a path package so that
  # `flutter test --coverage` measures it (see tool/pubspec.yaml).
  kiveto_tool:
    path: tool
  mocktail: 1.0.5
  very_good_analysis: 11.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # gen-l10n writes lib/l10n/app_localizations*.dart from lib/l10n/app_fr.arb
  # (l10n.yaml); the output is committed.
  generate: true

  # The licences registered at startup (app/bootstrap/asset_licenses.dart):
  # DM Sans (SIL OFL 1.1) and the Lucide icons drawn by the UI kit (ISC).
  assets:
    - assets/fonts/OFL.txt
    - assets/licenses/lucide.txt

  # DM Sans 4.004, the variable font (opsz 9–40, wght 100–1000) of
  # google/fonts at 5b35b72, renamed without brackets or commas. FontWeight
  # drives the wght axis; every style sets opsz to its size (KivetoText).
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
