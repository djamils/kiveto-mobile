# Analyzer configuration of Kiveto Mobile (architecture §8).
#
# `make analyze` runs `dart analyze --fatal-infos --fatal-warnings`: every
# diagnostic below fails the build, infos included. When a rule conflicts
# with what you want to write, the rule wins (CLAUDE.md §6); a justified
# exception is a `// ignore: <rule>` with the reason on the line above.

# The strictest maintained rule set (very_good_analysis 11.0.0, pinned in
# pubspec.yaml).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Build outputs and the native projects: not Dart sources of ours.
    - build/**
    - android/**
    - ios/**
    # The generated Portal API client (phase 4): generated, committed, never
    # edited by hand (CLAUDE.md §5).
    - packages/**
    # gen-l10n output (the ARB files are the source); any other Dart file
    # of lib/l10n/ is analyzed.
    - lib/l10n/app_localizations*.dart
  errors:
    # A deprecated API is removed by a later Flutter release: fix it now.
    deprecated_member_use: error

linter:
  rules:
    # An app, not a published API: documenting every public member adds
    # noise. Very Good Ventures' own app template turns it off too.
    public_member_api_docs: false

# riverpod_lint 3.1.9 on the analyzer plugin system: `dart analyze` fetches
# it from pub and reports its diagnostics like any lint (no pubspec entry).
plugins:
  riverpod_lint: 3.1.9
