name: kiveto_tool
description: "Dart tooling of the Kiveto Mobile repository: device picker, coverage gate."
publish_to: none

# A package of its own so that `flutter test --coverage
# --coverage-package=kiveto_tool` measures tool/lib/ (code imported through a
# relative path is never recorded). The root pubspec depends on it by path;
# `fvm dart tool/<x>.dart` resolves `package:kiveto_tool/` through the root
# .dart_tool/package_config.json. SDK libraries only: no dependency.

environment:
  sdk: ^3.13.7
